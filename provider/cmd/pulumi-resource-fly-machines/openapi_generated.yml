                    type: integer
                monthly_price_usd:
                    description: Base monthly price in US dollars.
                    example: 38
                    type: integer
                plan:
                    description: Plan slug. Pass it as `plan` when creating or forking a cluster.
                    enum:
                        - basic
                        - starter
                        - launch
                        - scale
                        - Performance
                    example: basic
                    type: string
            type: object
        PostgresQueryColumn:
            properties:
                name:
