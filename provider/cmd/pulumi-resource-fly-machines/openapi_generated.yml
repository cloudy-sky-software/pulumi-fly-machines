                org_slug:
                    description: Slug of the organization the token is scoped to.
                    type: string
                organization:
                    description: Name of the organization the token is scoped to.
                    type: string
                restricted_to_machine:
                    description: |-
                        ID of the Machine the token may only be used from. Omitted if the token is not restricted
                        to a Machine.
                    type: string
                source_machine_id:
                    description: Never set.
                    type: string
                token_id:
                    description: ID of the token.
                    type: string
                user:
                    description: |-
                        Opaque identifier of the user the token belongs to: the first 7 hex characters of a hash of
