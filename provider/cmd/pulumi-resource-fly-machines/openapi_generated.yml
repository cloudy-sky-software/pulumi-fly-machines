                tcp:
                    allOf:
                        - $ref: '#/components/schemas/fly.TCPHealthcheck'
                    description: Check that a TCP connection can be opened
                    type: object
                timeout:
                    description: The time in seconds to wait for the check to complete.
                    type: integer
                unhealthy:
                    $ref: '#/components/schemas/fly.UnhealthyPolicy'
            type: object
        fly.ContainerHealthcheckKind:
            enum:
                - readiness
                - liveness
            type: string
            x-enum-varnames:
                - Readiness
                - Liveness
        fly.ContainerHealthcheckScheme:
            enum:
                - http
                - https
            type: string
            x-enum-varnames:
                - HTTP
                - HTTPS
        fly.DNSConfig:
            properties:
                dns_forward_rules:
                    description: Forward DNS queries for some domains to other DNS servers
                    items:
                        $ref: '#/components/schemas/fly.dnsForwardRule'
                    type: array
                hostname:
                    description: |-
                        Hostname of the Machine. Defaults to the Machine ID. Also added to /etc/hosts with the
                        Machine's 6PN address
                    type: string
                hostname_fqdn:
                    description: Fully qualified domain name added to /etc/hosts for `hostname`
                    type: string
                nameservers:
                    description: Nameservers to use instead of the default, Fly.io's private DNS server `fdaa::3`
                    items:
                        type: string
                    type: array
                options:
                    description: Options for /etc/resolv.conf
                    items:
                        $ref: '#/components/schemas/fly.dnsOption'
                    type: array
                searches:
                    description: Search domains for /etc/resolv.conf
                    items:
                        type: string
                    type: array
                skip_registration:
                    description: Currently has no effect
                    type: boolean
            type: object
        fly.EnvFrom:
            description: EnvVar defines an environment variable to be populated from a machine field, env_var
            properties:
                env_var:
                    description: |-
                        EnvVar is required and is the name of the environment variable that will be set from the
                        secret. It must be a valid environment variable name.
                    type: string
                field_ref:
                    description: 'FieldRef selects a field of the Machine: supports id, version, app_name, private_ip, region, image.'
                    enum:
                        - id
                        - version
                        - app_name
                        - private_ip
                        - region
                        - image
                    type: string
            type: object
        fly.ExecHealthcheck:
            properties:
                command:
                    description: The command to run to check the health of the container (e.g. ["cat", "/tmp/healthy"])
                    items:
                        type: string
                    type: array
            type: object
        fly.File:
            description: A file that will be written to the Machine. One of RawValue or SecretName must be set.
            properties:
                guest_path:
                    description: |-
                        GuestPath is the path on the machine where the file will be written and must be an absolute path.
                        For example: /full/path/to/file.json
                    type: string
                image_config:
                    description: The name of an image to use the OCI image config as the file contents.
                    type: string
                mode:
                    description: Mode bits used to set permissions on this file as accepted by chmod(2).
                    type: integer
                raw_value:
                    description: The base64 encoded string of the file contents.
                    type: string
                secret_name:
                    description: The name of the secret that contains the base64 encoded file contents.
                    type: string
            type: object
        fly.HTTPHealthcheck:
            properties:
                headers:
                    description: Additional headers to send with the request
                    items:
                        $ref: '#/components/schemas/fly.MachineHTTPHeader'
                    type: array
                method:
                    description: The HTTP method to use to when making the request
                    type: string
                path:
                    description: The path to send the request to
                    type: string
                port:
                    description: The port to connect to, often the same as internal_port
                    type: integer
                scheme:
                    $ref: '#/components/schemas/fly.ContainerHealthcheckScheme'
                tls_server_name:
                    description: If the protocol is https, the hostname to use for TLS certificate validation
                    type: string
                tls_skip_verify:
                    description: If the protocol is https, whether or not to verify the TLS certificate
                    type: boolean
            type: object
        fly.HTTPOptions:
            properties:
                compress:
                    description: Compress response bodies. Defaults to true
                    type: boolean
                h2_backend:
                    description: Use HTTP/2 to talk to the Machine
                    type: boolean
                headers_read_timeout:
                    description: Seconds Fly Proxy waits for a client to send request headers. Defaults to 5
                    type: integer
                idle_timeout:
                    description: Seconds a client connection can be idle between requests before it's closed. Defaults to 300
                    type: integer
                replay_cache:
                    description: |-
                        Cache `fly-replay` responses from the Machine: once a client is replayed, its further
                        requests are replayed directly, keyed on a cookie or header, without asking the Machine again
                    items:
                        $ref: '#/components/schemas/fly.ReplayCache'
                    type: array
                response:
                    allOf:
                        - $ref: '#/components/schemas/fly.HTTPResponseOptions'
                    description: Changes Fly Proxy makes to responses
                    type: object
            type: object
        fly.HTTPResponseOptions:
            properties:
                headers:
                    additionalProperties:
                        type: object
                    description: |-
                        Response headers to set. A string sets the header, a list of strings sets it to multiple
                        values, and false removes it
                    type: object
                pristine:
                    description: Don't let Fly Proxy add or change any response headers
                    type: boolean
            type: object
        fly.MachineCacheDrive:
            properties:
                path:
                    description: |-
                        Optional absolute guest mount path. When set, the device is formatted as ext4.
                        Without a path, the device retains legacy raw block behavior. Contents survive
                        same-host restarts and path changes, but are discarded on size or mode changes,
                        relocation, recovery on another host, and cloning.
                    type: string
                size_mb:
                    description: |-
                        Fixed size of the Machine-owned cache drive in MiB. At most 51200.
                        With a path, at least 16 MiB is required; without a path, 0 disables the device.
                    type: integer
            type: object
        fly.MachineCheck:
            properties:
                grace_period:
                    description: The time to wait after a VM starts before checking its health
                    example: 1s
                    type: string
                headers:
                    description: For http checks, headers to send with the request
                    items:
                        $ref: '#/components/schemas/fly.MachineHTTPHeader'
                    type: array
                interval:
                    description: The time between connectivity checks
                    example: 15s
                    type: string
                kind:
                    description: Kind of the check (informational, readiness)
                    enum:
                        - informational
                        - readiness
                    type: string
                method:
                    description: For http checks, the HTTP method to use to when making the request
                    type: string
                path:
                    description: For http checks, the path to send the request to
                    type: string
                port:
                    description: The port to connect to, often the same as internal_port
                    type: integer
                protocol:
                    description: For http checks, whether to use http or https
                    type: string
                timeout:
                    description: The maximum time a connection can take before being reported as failing its health check
                    example: 2s
                    type: string
                tls_server_name:
                    description: If the protocol is https, the hostname to use for TLS certificate validation
                    type: string
                tls_skip_verify:
                    description: For http checks with https protocol, whether or not to verify the TLS certificate
                    type: boolean
                type:
                    description: tcp or http
                    type: string
            type: object
        fly.MachineConfig:
            properties:
                auto_destroy:
                    description: Optional boolean telling the Machine to destroy itself once it’s complete (default false)
                    type: boolean
                cache_drive:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineCacheDrive'
                    description: 'Beta: a cache drive attached to the Machine. This field may be removed in the future'
                    type: object
                checks:
                    additionalProperties:
                        $ref: '#/components/schemas/fly.MachineCheck'
                    description: An optional object that defines one or more named top-level checks. The key for each check is the check name.
                    type: object
                containers:
                    description: Containers are a list of containers that will run in the machine, each from its own image.
                    items:
                        $ref: '#/components/schemas/fly.ContainerConfig'
                    type: array
                disable_machine_autostart:
                    description: 'Deprecated: use Service.Autostart instead'
                    type: boolean
                dns:
                    allOf:
                        - $ref: '#/components/schemas/fly.DNSConfig'
                    description: DNS settings for the Machine
                    type: object
                env:
                    additionalProperties:
                        type: string
                    description: An object filled with key/value pairs to be set as environment variables
                    type: object
                files:
                    description: Files to write into the Machine, from either a raw value or an app secret
                    items:
                        $ref: '#/components/schemas/fly.File'
                    type: array
                guest:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineGuest'
                    description: The resources (CPUs, memory, etc.) allocated to the Machine
                    type: object
                image:
                    description: The docker image to run
                    type: string
                init:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineInit'
                    description: Arguments for init, Fly.io's footprint inside the Machine, which controls how your own code is run
                    type: object
                metadata:
                    additionalProperties:
                        type: string
                    description: Key/value pairs of Machine metadata. Fly.io uses metadata internally for routing, process groups, and clusters
                    type: object
                metrics:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineMetrics'
                    description: An optional metrics endpoint for Prometheus on Fly.io to scrape
                    type: object
                mounts:
                    description: |-
                        Persistent volumes to mount in the Machine. A Machine can mount at most one volume, which must be on
                        the same host. The mounted volume cannot be changed by updating the Machine
                    items:
                        $ref: '#/components/schemas/fly.MachineMount'
                    type: array
                processes:
                    description: |-
                        Multiple processes to run within this one Machine, all from the Machine's image. Unrelated to the
                        process groups in fly.toml, which run on separate Machines. To run processes from different
                        images, use containers instead
                    items:
                        $ref: '#/components/schemas/fly.MachineProcess'
                    type: array
                restart:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineRestart'
                    description: Whether and how the Machine is restarted after its main process exits
                    type: object
                rootfs:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineRootfs'
                    description: |-
                        Beta: the size of the Machine's root filesystem and whether it persists. This field may be
                        removed in the future
                    type: object
                schedule:
                    description: |-
                        Run the Machine at an interval: one of hourly, daily, weekly or monthly. The interval starts when
                        the Machine is created
                    type: string
                services:
                    description: Network services that Fly Proxy routes traffic to
                    items:
                        $ref: '#/components/schemas/fly.MachineService'
                    type: array
                size:
                    description: 'Deprecated: use Guest instead'
                    type: string
                spot:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineSpot'
                    description: Spot pricing settings for the Machine
                    type: object
                standbys:
                    description: |-
                        Standbys enable a machine to be a standby for another. In the event of a hardware failure,
                        the standby machine will be started.
                    items:
                        type: string
                    type: array
                statics:
                    description: |-
                        Static files to serve under a URL prefix. Fly Proxy routes matching requests to a file server
                        inside the Machine, bypassing your application's own process; the Machine must be running. The
                        files are read either from a path inside the Machine or from a Tigris bucket that belongs to the
                        app; no bucket is created for you
                    items:
                        $ref: '#/components/schemas/fly.Static'
                    type: array
                stop_config:
                    allOf:
                        - $ref: '#/components/schemas/fly.StopConfig'
                    description: 'How the Machine is shut down gracefully: the signal sent to it and how long to wait before a hard shutdown'
                    type: object
            type: object
        fly.MachineGuest:
            properties:
                cpu_kind:
                    description: |-
                        Kind of CPU: shared or performance. Performance CPUs must be enabled for the organization.
                        Defaults to shared when `guest` is omitted
                    type: string
                cpus:
                    description: |-
                        Number of CPUs: 1, 2, 4, 6, 8, 10, 12, 14, 16, 32, 64 or 128, up to 8 for shared and 16 for
                        performance CPUs unless the organization's limit is higher. Defaults to 1 when `guest` is
                        omitted
                    type: integer
                gpu_kind:
                    description: No longer supported. Requests that set it are rejected
                    type: string
                gpus:
                    description: No longer supported. Requests that set it are rejected
                    type: integer
                host_dedication_id:
                    description: |-
                        Place the Machine on hosts dedicated to the organization under this ID. Only available to
                        organizations with dedicated hosts
                    type: string
                kernel_args:
                    description: Extra arguments appended to the guest kernel command line
                    items:
                        type: string
                    type: array
                max_memory_mb:
                    description: |-
                        Memory in MiB that the Machine's memory limit can later be raised to without a restart, using
                        the memory endpoints. Must be at least memory_mb and at most the per-CPU maximum. The Machine
                        starts with a limit of memory_mb
                    type: integer
                memory_mb:
                    description: |-
                        Memory in MiB. Must be a multiple of 256 for shared and 1024 for performance CPUs, and
                        between 256 and 2048 (shared) or 2048 and 8192 (performance) per CPU. Defaults to 256 when
                        `guest` is omitted
                    type: integer
                persist_rootfs:
                    description: 'Deprecated: use MachineConfig.Rootfs instead'
                    enum:
                        - never
                        - always
                        - restart
                    type: string
                required_host_features:
                    description: |-
                        Host features the Machine's host must have, such as `storage-tier-1`. At most 16, each made
                        of lowercase letters, digits and dashes. Each feature must be enabled for the organization
                    items:
                        type: string
                    type: array
            type: object
        fly.MachineHTTPHeader:
            description: For http checks, an array of objects with string field Name and array of strings field Values. The key/value pairs specify header and header values that will get passed with the check call.
            properties:
                name:
                    description: The header name
                    type: string
                values:
                    description: The header value
                    items:
                        type: string
                    type: array
            type: object
        fly.MachineInit:
            properties:
                cmd:
                    description: Replaces the image's CMD. It's appended to the entrypoint
                    items:
                        type: string
                    type: array
                entrypoint:
                    description: Replaces the image's ENTRYPOINT
                    items:
                        type: string
                    type: array
                exec:
                    description: |-
                        Command to run instead of the image's ENTRYPOINT and CMD. Takes precedence over entrypoint
                        and cmd
                    items:
                        type: string
                    type: array
                kernel_args:
                    description: Currently has no effect. Use `guest.kernel_args` instead
                    items:
                        type: string
                    type: array
                swap_size_mb:
                    description: Size in MiB of a swap device to give the Machine. Machines with swap cannot be suspended
                    type: integer
                tty:
                    description: Currently has no effect
                    type: boolean
            type: object
        fly.MachineMetrics:
            properties:
                https:
                    description: Scrape over HTTPS instead of HTTP
                    type: boolean
                path:
                    description: HTTP path to scrape. Defaults to `/`
                    type: string
                port:
                    description: Port in the Machine to scrape metrics from
                    type: integer
            type: object
        fly.MachineMount:
            properties:
                add_size_gb:
                    description: |-
                        With automatic extension, grow the volume by this many GB at a time. Between 1 and 100.
                        Mutually exclusive with add_size_percent
                    type: integer
                add_size_percent:
                    description: |-
                        AddSizePercent grows by a percentage of the current size, rounded up to GiB.
                        It is mutually exclusive with AddSizeGb.
                    type: integer
                encrypted:
                    description: Whether the volume is encrypted. Set by Fly.io; ignored in requests
                    type: boolean
                extend_threshold_percent:
                    description: |-
                        Enable automatic volume extension: grow the volume when its usage exceeds this percentage.
                        Between 50 and 99; 0 disables it
                    type: integer
                min_add_size_gb:
                    description: MinAddSizeGb is the minimum proportional growth in GiB (default 1).
                    type: integer
                name:
                    description: Name of the volume. Set by Fly.io; ignored in requests
                    type: string
                path:
                    description: Absolute path in the Machine to mount the volume at. Required
                    type: string
                size_gb:
                    description: Size of the volume in GB. Set by Fly.io; ignored in requests
                    type: integer
                size_gb_limit:
                    description: |-
                        With automatic extension, never grow the volume beyond this size in GB. At most the
                        organization's maximum volume size
                    type: integer
                volume:
                    description: |-
                        ID (`vol_...`) or name of the volume to mount. Required. With a name, any unattached volume
                        of the app with that name in the Machine's region is used
                    type: string
            type: object
        fly.MachinePort:
            properties:
                end_port:
                    description: Last public port of a range
                    type: integer
                force_https:
                    description: Redirect plain HTTP requests to HTTPS
                    type: boolean
                handlers:
                    description: |-
                        How Fly Proxy handles connections before forwarding them: `tls` terminates TLS, `pg_tls`
                        terminates PostgreSQL TLS, `http` handles HTTP, `proxy_proto` adds a PROXY protocol header.
                        Without handlers, raw TCP is forwarded
                    items:
                        type: string
                    type: array
                http_options:
                    allOf:
                        - $ref: '#/components/schemas/fly.HTTPOptions'
                    description: Options for the `http` handler
                    type: object
                port:
                    description: Public port. Use either port, or start_port and end_port
                    type: integer
                proxy_proto_options:
                    allOf:
                        - $ref: '#/components/schemas/fly.ProxyProtoOptions'
                    description: Options for the `proxy_proto` handler
                    type: object
                start_port:
                    description: First public port of a range
                    type: integer
                tls_options:
                    allOf:
                        - $ref: '#/components/schemas/fly.TLSOptions'
                    description: Options for the `tls` handler
                    type: object
            type: object
        fly.MachineProcess:
            properties:
                cmd:
                    description: Replaces the image's CMD for this process. It's appended to the entrypoint
                    items:
                        type: string
                    type: array
                entrypoint:
                    description: Replaces the image's ENTRYPOINT for this process
                    items:
                        type: string
                    type: array
                env:
                    additionalProperties:
                        type: string
                    description: Environment variables for this process, in addition to the Machine's `env`
                    type: object
                env_from:
                    description: EnvFrom can be provided to set environment variables from machine fields.
                    items:
                        $ref: '#/components/schemas/fly.EnvFrom'
                    type: array
                exec:
                    description: |-
                        Command to run instead of the image's ENTRYPOINT and CMD. Takes precedence over entrypoint
                        and cmd
                    items:
                        type: string
                    type: array
                ignore_app_secrets:
                    description: |-
                        IgnoreAppSecrets can be set to true to ignore the secrets for the App the Machine belongs to
                        and only use the secrets provided at the process level. The default/legacy behavior is to use
                        the secrets provided at the App level.
                    type: boolean
                secrets:
                    description: |-
                        Secrets can be provided at the process level to explicitly indicate which secrets should be
                        used for the process. If not provided, the secrets provided at the machine level will be used.
                    items:
                        $ref: '#/components/schemas/fly.MachineSecret'
                    type: array
                user:
                    description: User to run the process as, instead of the image's USER
                    type: string
            type: object
        fly.MachineRestart:
            description: The Machine restart policy defines whether and how flyd restarts a Machine after its main process exits. See https://fly.io/docs/machines/guides-examples/machine-restart-policy/.
            properties:
                max_retries:
                    description: When policy is on-failure, the maximum number of times to attempt to restart the Machine before letting it stop.
                    type: integer
                policy:
                    description: |-
                        * no - Never try to restart a Machine automatically when its main process exits, whether that’s on purpose or on a crash.
                        * always - Always restart a Machine automatically and never let it enter a stopped state, even when the main process exits cleanly.
                        * on-failure - Try up to MaxRetries times to automatically restart the Machine if it exits with a non-zero exit code. Default when no explicit policy is set, and for Machines with schedules.
                    enum:
                        - "no"
                        - always
                        - on-failure
                    type: string
            type: object
        fly.MachineRootfs:
            properties:
                persist:
                    description: |-
                        Whether changes to the root filesystem are kept. `never` (default): reset on every start.
                        `restart`: kept across stops and restarts, reset when the Machine is updated. `always`: also
                        kept across updates
                    enum:
                        - never
                        - always
                        - restart
                    type: string
                size_gb:
                    description: Size of the root filesystem in GB. At most 50; 0 uses the default
                    type: integer
            type: object
        fly.MachineSecret:
            description: A Secret needing to be set in the environment of the Machine. env_var is required
            properties:
                env_var:
                    description: |-
                        EnvVar is required and is the name of the environment variable that will be set from the
                        secret. It must be a valid environment variable name.
                    type: string
                name:
                    description: |-
                        Name is optional and when provided is used to reference a secret name where the EnvVar is
                        different from what was set as the secret name.
                    type: string
            type: object
        fly.MachineService:
            properties:
                autostart:
                    description: Whether Fly Proxy starts stopped or suspended Machines when requests arrive. Defaults to true
                    type: boolean
                autostop:
                    description: |-
                        Accepts a string (new format) or a boolean (old format). For backward compatibility with older clients, the API continues to use booleans for "off" and "stop" in responses.
                        * "off" or false - Do not autostop the Machine.
                        * "stop" or true - Automatically stop the Machine.
                        * "suspend" - Automatically suspend the Machine, falling back to a full stop if this is not possible.
                    enum:
                        - "off"
                        - stop
                        - suspend
                    type: string
                checks:
                    description: An optional list of service checks
                    items:
                        $ref: '#/components/schemas/fly.MachineServiceCheck'
                    type: array
                concurrency:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineServiceConcurrency'
                    description: Load limits Fly Proxy uses to balance traffic across Machines
                    type: object
                force_instance_description:
                    description: Currently has no effect
                    type: string
                force_instance_key:
                    description: Currently has no effect
                    type: string
                internal_port:
                    description: Port in the Machine that Fly Proxy forwards traffic to. Defaults to 8080
                    type: integer
                min_machines_running:
                    description: |-
                        When autostop is on, the number of Machines Fly Proxy keeps running in the app's primary
                        region (`PRIMARY_REGION` env var). Machines in other regions can all be stopped
                    type: integer
                ports:
                    description: Public ports that Fly Proxy accepts traffic on
                    items:
                        $ref: '#/components/schemas/fly.MachinePort'
                    type: array
                protocol:
                    description: 'Protocol: tcp or udp. Defaults to tcp'
                    type: string
            type: object
        fly.MachineServiceCheck:
            properties:
                grace_period:
                    description: The time to wait after a VM starts before checking its health
                    example: 1s
                    type: string
                headers:
                    description: For http checks, headers to send with the request
                    items:
                        $ref: '#/components/schemas/fly.MachineHTTPHeader'
                    type: array
                interval:
                    description: The time between connectivity checks
                    example: 15s
                    type: string
                method:
                    description: For http checks, the HTTP method to use to when making the request
                    type: string
                path:
                    description: For http checks, the path to send the request to
                    type: string
                port:
                    description: The port to connect to, often the same as internal_port
                    type: integer
                protocol:
                    description: For http checks, whether to use http or https
                    type: string
                timeout:
                    description: The maximum time a connection can take before being reported as failing its health check
                    example: 2s
                    type: string
                tls_server_name:
                    description: If the protocol is https, the hostname to use for TLS certificate validation
                    type: string
                tls_skip_verify:
                    description: For http checks with https protocol, whether or not to verify the TLS certificate
                    type: boolean
                type:
                    description: tcp or http
                    type: string
            type: object
        fly.MachineServiceConcurrency:
            properties:
                hard_limit:
                    description: |-
                        Fly Proxy sends no more than this many connections or requests to a Machine at once. 0 means
                        no hard limit
                    type: integer
                soft_limit:
                    description: |-
                        Above this many connections or requests, Fly Proxy prefers other Machines. Defaults to 20,
                        and is lowered to hard_limit if higher
                    type: integer
                type:
                    description: 'What to count: `connections` (default) or `requests`'
                    type: string
            type: object
        fly.MachineSpot:
            properties:
                max_price_fraction:
                    description: 'MaxPriceFraction is the maximum fraction of the full Machine price you will pay for this Machine. Range: (0, 1.0]'
                    type: number
            type: object
        fly.ProxyProtoOptions:
            properties:
                fly_src:
                    description: With version v2, add the Fly-Src header and its signature to the PROXY protocol header
                    type: boolean
                version:
                    description: 'PROXY protocol version: v1 (default) or v2'
                    type: string
            type: object
        fly.ReplayCache:
            properties:
                allow_bypass:
                    description: 'Let clients skip the cache by sending the `fly-replay-cache-control: skip` header'
                    type: boolean
                name:
                    description: Name of the cookie or header to key the cache on
                    type: string
                path_prefix:
                    description: |-
                        Requests whose path starts with this prefix use the rule. May start with a hostname, e.g.
                        `example.com/api/*`
                    type: string
                ttl_seconds:
                    description: How long a cached replay is used, in seconds
                    type: integer
                type:
                    description: Currently either "cookie" or "header"
                    enum:
                        - cookie
                        - header
                    type: string
            type: object
        fly.Static:
            properties:
                guest_path:
                    description: The path inside the Machine, or inside tigris_bucket when set, where the files to serve are located
                    type: string
                index_document:
                    description: The document served for requests to the URL prefix or any of its subfolders. Only works with tigris_bucket
                    type: string
                tigris_bucket:
                    description: |-
                        An existing Tigris bucket belonging to the app to read the files from, instead of the Machine's
                        filesystem. The files are still served through the Machine
                    type: string
                url_prefix:
                    description: The URL prefix under which the files are served
                    type: string
            required:
                - guest_path
                - url_prefix
            type: object
        fly.StopConfig:
            properties:
                signal:
                    description: Signal to send to the Machine's processes. Defaults to SIGINT
                    enum:
                        - SIGHUP
                        - SIGINT
                        - SIGQUIT
                        - SIGKILL
                        - SIGUSR1
                        - SIGUSR2
                        - SIGTERM
                    type: string
                timeout:
                    description: |-
                        How long to wait for the Machine to exit after sending the signal, before killing it. At most
                        5 minutes (1 minute for spot Machines). Defaults to 5s (60s for spot Machines)
                    example: 10s
                    type: string
            type: object
