openapi: 3.1.0
components:
    schemas:
        AcmeChallenge:
            properties:
                name:
                    description: Name of the CNAME record to create, such as `_acme-challenge.example.com`.
                    type: string
                target:
                    description: Value the CNAME record must point to.
                    type: string
            type: object
        App:
            properties:
                id:
                    description: Unique ID of the app, as used by Fly.io's GraphQL API.
                    type: string
                internal_numeric_id:
                    description: Fly.io's internal numeric ID of the app.
                    type: integer
                machine_count:
                    description: Number of the app's Machines that have not been destroyed.
                    type: integer
                name:
                    description: Globally unique name of the app.
                    type: string
                network:
                    description: |-
                        Name of the private network the app is attached to: `default` for the organization's
                        default network, or the name given when the app was created.
                    type: string
                network_cidr:
                    description: |-
                        The /48 IPv6 prefix of the private (6PN) network the app is attached to, such as
                        `fdaa:0:1234::/48`. Apps on the same network share it.
                    type: string
                organization:
                    allOf:
                        - $ref: '#/components/schemas/AppOrganizationInfo'
                    description: The organization that owns the app.
                    type: object
                status:
                    description: |-
                        State of the app. `pending` until one of its Machines changes state. After that, updated
                        asynchronously whenever a Machine changes state: `deployed` if at least one Machine is
                        started, and `suspended` otherwise.
                    enum:
                        - pending
                        - deployed
                        - suspended
                    type: string
                volume_count:
                    description: Number of the app's volumes that have not been destroyed or scheduled for destruction.
                    type: integer
            type: object
        AppOrganizationInfo:
            properties:
                internal_numeric_id:
                    description: Fly.io's internal numeric ID of the organization.
                    type: integer
                name:
                    description: Display name of the organization.
                    type: string
                slug:
                    description: Slug of the organization, used to refer to it in API requests such as `org_slug`.
                    type: string
            type: object
        AppSecret:
            properties:
                created_at:
                    description: When the secret was first set. Only returned when reading secrets.
                    type: string
                digest:
                    description: |-
                        Short fingerprint of the value, to tell whether it changed without revealing it. Omitted
                        for deleted secrets.
                    type: string
                name:
                    description: Name of the secret.
                    type: string
                updated_at:
                    description: When the secret's value last changed. Only returned when reading secrets.
                    type: string
                value:
                    description: Value of the secret. Only returned with `show_secrets=true`, and when setting secrets.
                    type: string
            type: object
        AppSecrets:
            properties:
                secrets:
                    description: The app's secrets.
                    items:
                        $ref: '#/components/schemas/AppSecret'
                    type: array
            type: object
        AppSecretsUpdateRequest:
            properties:
                values:
                    additionalProperties:
                        type: string
                    description: |-
                        Secrets to change, keyed by name. A string value sets the secret; null deletes it. Names
                        may only contain letters, digits, and underscores. Secrets not listed are left alone.
                    type: object
            type: object
        AppSecretsUpdateResp:
            properties:
                secrets:
                    description: |-
                        The secrets from the request, with their new values and digests; deleted secrets only
                        have a name.
                    items:
                        $ref: '#/components/schemas/AppSecret'
                    type: array
                version:
                    description: |-
                        The app's secrets version after this change. Pass it as `min_secrets_version` when creating or
                        updating Machines so that they are guaranteed to see the change.
                    type: integer
            type: object
        AssignIPResponse:
            properties:
                created_at:
                    description: When the address was assigned to the app, in RFC 3339 format.
                    type: string
                egress:
                    description: Whether this is an egress address.
                    type: boolean
                ip:
                    description: The allocated IP address. Null for `egress_pair`; see `ip_pair`.
                    type: string
                ip_pair:
                    allOf:
                        - $ref: '#/components/schemas/IPPair'
                    description: |-
                        The allocated IPv4 and IPv6 addresses when the `egress_pair` type was requested; null
                        otherwise.
                    type: object
                network:
                    $ref: '#/components/schemas/IPAssignmentNetwork'
                region:
                    description: Region the address is scoped to, or `global` for addresses announced in all regions.
                    type: string
                service_name:
                    description: Name of the service the address is scoped to, if any.
                    type: string
                shared:
                    description: Whether this is the app's shared IPv4 address.
                    type: boolean
            type: object
        CertificateCheckResponse:
            properties:
                acme_requested:
                    description: Whether Fly.io-issued (ACME) certificates were requested for the hostname.
                    type: boolean
                certificates:
                    description: 'The hostname''s certificates: at most one custom entry and one Fly.io entry.'
                    items:
                        $ref: '#/components/schemas/CertificateEntry'
                    type: array
                configured:
                    description: Whether ownership of the hostname has been verified.
                    type: boolean
                dns_provider:
                    description: DNS provider detected for the hostname, if known.
                    type: string
                dns_records:
                    $ref: '#/components/schemas/DNSRecords'
                dns_requirements:
                    allOf:
                        - $ref: '#/components/schemas/DNSRequirements'
                    description: DNS records to create to point the hostname at the app and validate it.
                    type: object
                hostname:
                    description: The hostname the certificate is for. May start with `*.` for a wildcard certificate.
                    type: string
                rate_limited_until:
                    description: If Let's Encrypt is rate-limiting certificate requests for the hostname, when that ends.
                    type: string
                status:
                    description: |-
                        Human-readable status: `Ready`, `Awaiting certificates`, `Awaiting configuration`, or a
                        hint about what is misconfigured.
                    type: string
                validation:
                    allOf:
                        - $ref: '#/components/schemas/CertificateValidation'
                    description: Which validation methods are currently possible.
                    type: object
                validation_errors:
                    description: Problems found by the most recent validation.
                    items:
                        $ref: '#/components/schemas/CertificateValidationError'
                    type: array
            type: object
        CertificateDetail:
            properties:
                acme_requested:
                    description: Whether Fly.io-issued (ACME) certificates were requested for the hostname.
                    type: boolean
                certificates:
                    description: 'The hostname''s certificates: at most one custom entry and one Fly.io entry.'
                    items:
                        $ref: '#/components/schemas/CertificateEntry'
                    type: array
                configured:
                    description: Whether ownership of the hostname has been verified.
                    type: boolean
                dns_provider:
                    description: DNS provider detected for the hostname, if known.
                    type: string
                dns_requirements:
                    allOf:
                        - $ref: '#/components/schemas/DNSRequirements'
                    description: DNS records to create to point the hostname at the app and validate it.
                    type: object
                hostname:
                    description: The hostname the certificate is for. May start with `*.` for a wildcard certificate.
                    type: string
                rate_limited_until:
                    description: If Let's Encrypt is rate-limiting certificate requests for the hostname, when that ends.
                    type: string
                status:
                    description: |-
                        Human-readable status: `Ready`, `Awaiting certificates`, `Awaiting configuration`, or a
                        hint about what is misconfigured.
                    type: string
                validation:
                    allOf:
                        - $ref: '#/components/schemas/CertificateValidation'
                    description: Which validation methods are currently possible.
                    type: object
                validation_errors:
                    description: Problems found by the most recent validation.
                    items:
                        $ref: '#/components/schemas/CertificateValidationError'
                    type: array
            type: object
        CertificateEntry:
            properties:
                created_at:
                    description: When the certificate was added; for Fly.io-issued certificates, the earliest one.
                    type: string
                expires_at:
                    description: When the certificate expires; for Fly.io-issued certificates, the latest one.
                    type: string
                issued:
                    description: The individual Fly.io-issued certificates, newest first. Empty for custom certificates.
                    items:
                        $ref: '#/components/schemas/IssuedCertificate'
                    type: array
                issuer:
                    description: Issuer of a custom certificate. Omitted for Fly.io-issued certificates.
                    type: string
                source:
                    description: '`custom` for an uploaded certificate, `fly` for certificates issued by Fly.io.'
                    enum:
                        - custom
                        - fly
                    type: string
                status:
                    description: |-
                        `active` once ownership of the hostname is verified. Until then, `pending_ownership` for
                        custom certificates and `pending_validation` for Fly.io-issued certificates.
                    enum:
                        - active
                        - pending_ownership
                        - pending_validation
                    type: string
            type: object
        CertificateSummary:
            properties:
                acme_alpn_configured:
                    description: Whether the hostname points at the app, allowing TLS-ALPN-01 validation.
                    type: boolean
                acme_dns_configured:
                    description: Whether the `_acme-challenge` CNAME record is set up, allowing DNS-01 validation.
                    type: boolean
                acme_http_configured:
                    description: Whether the hostname points at the app, allowing HTTP-01 validation.
                    type: boolean
                acme_requested:
                    description: Whether Fly.io-issued (ACME) certificates were requested for the hostname.
                    type: boolean
                configured:
                    description: Whether ownership of the hostname has been verified by any of the methods above.
                    type: boolean
                created_at:
                    description: When the hostname was added to the app.
                    type: string
                dns_provider:
                    description: DNS provider detected for the hostname, if known.
                    type: string
                has_custom_certificate:
                    description: Whether a custom certificate was uploaded for the hostname.
                    type: boolean
                has_fly_certificate:
                    description: Whether Fly.io has issued certificates for the hostname.
                    type: boolean
                hostname:
                    description: The hostname the certificate is for. May start with `*.` for a wildcard certificate.
                    type: string
                ownership_txt_configured:
                    description: Whether the `_fly-ownership` TXT record is set up.
                    type: boolean
                status:
                    description: |-
                        Human-readable status: `Ready`, `Awaiting certificates`, `Awaiting configuration`, or a
                        hint about what is misconfigured.
                    type: string
                updated_at:
                    description: When the hostname's certificate configuration last changed.
                    type: string
            type: object
        CertificateValidation:
            properties:
                alpn_configured:
                    description: Whether the hostname points at the app, allowing TLS-ALPN-01 validation.
                    type: boolean
                dns_configured:
                    description: Whether the `_acme-challenge` CNAME record is set up, allowing DNS-01 validation.
                    type: boolean
                http_configured:
                    description: Whether the hostname points at the app, allowing HTTP-01 validation.
                    type: boolean
                ownership_txt_configured:
                    description: Whether the `_fly-ownership` TXT record is set up.
                    type: boolean
            type: object
        CertificateValidationError:
            properties:
                code:
                    description: Machine-readable error code.
                    type: string
                message:
                    description: Human-readable description of the problem.
                    type: string
                remediation:
                    description: How to fix the problem, if known.
                    type: string
                timestamp:
                    description: When the problem was detected.
                    type: string
            type: object
        CheckStatus:
            properties:
                name:
                    description: |-
                        Name of the check: the key of a top-level check in `config.checks`, or
                        `servicecheck-<index>-<type>-<internal_port>` for a check defined in a service.
                    type: string
                output:
                    description: Output of the most recent check run, such as an error message.
                    type: string
                status:
                    description: 'Result of the check: `passing`, `warning`, or `critical`.'
                    enum:
                        - passing
                        - warning
                        - critical
                    type: string
                updated_at:
                    description: When the check's status was last updated.
                    type: string
            type: object
        CreateAppDeployTokenRequest:
            properties:
                expiry:
                    description: |-
                        How long the token is valid, as a Go duration string such as `720h`. If omitted, the
                        token is valid for as long as the token used to make this request.
                    type: string
            type: object
        CreateAppDeployTokenResponse:
            properties:
                token:
                    description: |-
                        The deploy token, including its `FlyV1 ` scheme prefix, ready to be used as an
                        `Authorization` header value. It is derived from the token used to make this request
                        and limited to the app, plus the organization's WireGuard and remote builder features.
                    type: string
            type: object
        CreateAppRequest:
            properties:
                enable_subdomains:
                    description: Request a wildcard TLS certificate for *.svc.<app-name>.fly.dev. Defaults to false. Certificate provisioning is asynchronous; this does not create services or configure their routing.
                    type: boolean
                idempotency_key:
                    description: |-
                        When set, makes a retry of this exact request safe: a
                        second create with the same key and the same name (or no name) returns
                        the app the first request created, instead of erroring on a false name
                        conflict or creating a duplicate. A second create with the same key
                        but a *different* name is rejected outright; it won't silently
                        hand back the first app.
                    type: string
                name:
                    description: Globally unique name for the app. Required.
                    type: string
                network:
                    description: Name of the organization's private network to attach the app to. Creates the network if it does not exist. Omit, use an empty string, or use "default" to select the organization's default network.
                    type: string
                org_slug:
                    description: Slug of the organization that will own the app, or "personal" for your personal organization. Required.
                    type: string
            type: object
        CreateAppResponse:
            properties:
                created_at:
                    description: When the app was created, in Unix milliseconds.
                    type: integer
                id:
                    description: |-
                        Name of the new app. Despite the field's name, this is not the app's `id` as returned by
                        Get App.
                    type: string
            type: object
        CreateLeaseRequest:
            properties:
                description:
                    description: Description or reason for the lease, shown to others who look at it.
                    type: string
                ttl:
                    description: How long the lease is valid, in seconds. Defaults to 60.
                    type: integer
            type: object
        CreateMachineRequest:
            properties:
                config:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineConfig'
                    description: An object defining the Machine configuration
                    type: object
                lease_ttl:
                    description: |-
                        Acquire a lease on the new Machine that lasts this many seconds. The response's `nonce`
                        field holds the lease nonce.
                    type: integer
                min_secrets_version:
                    description: |-
                        The minimum version of the app's secrets the Machine must run with. Set it to the `version`
                        returned by the endpoints that set or delete app secrets, so that the Machine is guaranteed
                        to see those changes. This field belongs at the top level of the request body, not in
                        `config`. If omitted, the app's current secrets version is looked up for you.
                    type: integer
                name:
                    description: |-
                        Name for this Machine. If omitted, one is generated for you. Names are not required to be
                        unique.
                    type: string
                region:
                    description: |-
                        The region to create the Machine in, such as `iad`. Also accepts a comma-separated list
                        of regions and region groups (`any`, `us`, `na`, `sa`, `eu`, `apac`, `africa`,
                        `asia_pacific`, `europe`, `north_america`, `south_america`), in which case Fly.io picks one
                        with capacity. If the Machine mounts a volume, defaults to the volume's region; the region
                        must include it. Otherwise defaults to the region of the API server handling the request,
                        which is usually the one closest to you.
                    type: string
                skip_launch:
                    description: |-
                        Create the Machine without starting it. It ends up `stopped`; start it with the Start
                        Machine endpoint. Not allowed for spot Machines.
                    type: boolean
                skip_secrets:
                    description: |-
                        Don't look up the app's current secrets version. The Machine still gets the app's
                        secrets, but may not see recent changes to them. Takes precedence over
                        `min_secrets_version`.
                    type: boolean
                skip_service_registration:
                    description: |-
                        Create the Machine cordoned, so Fly Proxy doesn't route requests to it until it is
                        uncordoned. Its services are still registered.
                    type: boolean
            type: object
        CreateOIDCTokenRequest:
            description: Optional parameters
            properties:
                aud:
                    description: Value of the token's `aud` claim. Defaults to `https://fly.io/<org-slug>`.
                    example: https://fly.io/org-slug
                    type: string
                aws_principal_tags:
                    description: |-
                        Add AWS principal tag claims (`https://aws.amazon.com/tags/principal_tags/<tag>`) for use
                        with AWS IAM: FlyAppName, FlyOrgSlug, FlyOrgId, FlyMachineName and FlyRegion.
                    type: boolean
            type: object
        CreateVolumeRequest:
            properties:
                auto_backup_enabled:
                    description: Take daily automatic snapshots of the volume. Defaults to `true`.
                    type: boolean
                compute:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineGuest'
                    description: |-
                        Requirements of the Machine that will use the volume, so that the volume is placed on a
                        host that can run it. Uses `cpus`, `memory_mb`, `cpu_kind`, `host_dedication_id`, and
                        `required_host_features`.
                    type: object
                compute_image:
                    description: Ignored.
                    type: string
                encrypted:
                    description: |-
                        Encrypt the volume at rest. Defaults to true. When forking, the source volume's setting
                        is used.
                    type: boolean
                fstype:
                    description: 'Filesystem to format the volume with: `ext4`, or `raw` for an unformatted block device.'
                    enum:
                        - ext4
                        - raw
                    type: string
                name:
                    description: 'Name of the volume: at most 30 lowercase letters, digits, and underscores. Required.'
                    type: string
                region:
                    description: |-
                        Region to create the volume in. Accepts the same values as the `region` of Create
                        Machine. When forking, defaults to the source volume's region; otherwise defaults to the
                        region of the API server handling the request.
                    type: string
                require_unique_zone:
                    description: |-
                        Place the volume on a host that has no other volume of the app with the same name in the
                        region, so that Machines using these volumes don't share a host. Fails with 400 if no
                        such host is available.
                    type: boolean
                size_gb:
                    description: |-
                        Size of the volume in GiB, from 1 to the organization's maximum (500 by default).
                        Required unless forking, in which case it must be omitted and the source volume's size
                        is used.
                    type: integer
                snapshot_id:
                    description: |-
                        ID of a snapshot to restore into the new volume. Mutually exclusive with
                        `source_volume_id`.
                    type: string
                snapshot_retention:
                    description: Number of days to keep snapshots of the volume, from 1 to 60. Defaults to 5.
                    type: integer
                source_volume_id:
                    description: |-
                        ID of a volume to fork: the new volume starts as a copy of it. The volume must belong to
                        an app in the same organization.
                    type: string
                unique_zone_app_wide:
                    description: |-
                        With `require_unique_zone`, avoid hosts with any volume of the app in the region, not
                        just volumes with the same name.
                    type: boolean
            type: object
        CurrentTokenResponse:
            properties:
                tokens:
                    description: |-
                        One entry per token in the Authorization header that could be verified, in no particular
                        order; use `token_id` to tell them apart. Tokens that fail verification or are not scoped
                        to an organization are left out.
                    items:
                        $ref: '#/components/schemas/main.tokenInfo'
                    type: array
            type: object
        DNSRecords:
            properties:
                a:
                    description: A records found for the hostname.
                    items:
                        type: string
                    type: array
                aaaa:
                    description: AAAA records found for the hostname.
                    items:
                        type: string
                    type: array
                acme_challenge_cname:
                    description: Target of the `_acme-challenge` CNAME record, if found.
                    type: string
                cname:
                    description: CNAME records found for the hostname.
                    items:
                        type: string
                    type: array
                ownership_txt:
                    description: Value of the `_fly-ownership` TXT record, if found.
                    type: string
                resolved_addresses:
                    description: All addresses the hostname resolved to, after following CNAMEs.
                    items:
                        type: string
                    type: array
                soa:
                    description: Primary name server from the SOA record of the hostname's zone.
                    type: string
            type: object
        DNSRequirements:
            properties:
                a:
                    description: |-
                        IPv4 addresses the hostname's A records can point to: the app's global IPv4 addresses
                        and its shared IPv4 address.
                    items:
                        type: string
                    type: array
                aaaa:
                    description: |-
                        IPv6 addresses the hostname's AAAA records can point to: the app's global IPv6
                        addresses.
                    items:
                        type: string
                    type: array
                acme_challenge:
                    allOf:
                        - $ref: '#/components/schemas/AcmeChallenge'
                    description: Record for DNS-01 validation.
                    type: object
                cname:
                    description: Target the hostname can CNAME to instead of using A and AAAA records.
                    type: string
                ownership:
                    allOf:
                        - $ref: '#/components/schemas/OwnershipVerification'
                    description: Record for proving ownership of the hostname.
                    type: object
            type: object
        DecryptSecretkeyRequest:
            properties:
                associated_data:
                    description: Additional data passed when encrypting, base64-encoded.
                    format: byte
                    pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                    type: string
                ciphertext:
                    description: Data to decrypt, as returned by the encrypt endpoint, base64-encoded.
                    format: byte
                    pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                    type: string
            type: object
        DecryptSecretkeyResponse:
            properties:
                plaintext:
                    description: Decrypted data, base64-encoded.
                    format: byte
                    pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                    type: string
            type: object
        DeleteAppSecretResponse:
            properties:
                version:
                    description: |-
                        The app's secrets version after this change. Pass it as `min_secrets_version` when creating or
                        updating Machines so that they are guaranteed to see the change.
                    type: integer
            type: object
        DeleteSecretkeyResponse:
            properties:
                version:
                    description: The app's secrets version after this change.
                    type: integer
            type: object
        EncryptSecretkeyRequest:
            properties:
                associated_data:
                    description: |-
                        Additional data to authenticate but not encrypt, base64-encoded. The same data must be
                        passed when decrypting.
                    format: byte
                    pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                    type: string
                plaintext:
                    description: Data to encrypt, base64-encoded.
                    format: byte
                    pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                    type: string
            type: object
        EncryptSecretkeyResponse:
            properties:
                ciphertext:
                    description: Encrypted data, base64-encoded.
                    format: byte
                    pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                    type: string
            type: object
        ErrorResponse:
            properties:
                details:
                    description: 'Deprecated: details about some errors. Do not rely on its contents.'
                    type: object
                error:
                    description: |-
                        Human-readable description of the error. Its wording may change; use `status` to tell
                        errors apart.
                    type: string
                status:
                    $ref: '#/components/schemas/main.statusCode'
            type: object
        ExecResponse:
            properties:
                exit_code:
                    description: The command's exit code.
                    type: integer
                exit_signal:
                    description: The signal that terminated the command, or 0 if it exited normally.
                    type: integer
                stderr:
                    description: The command's standard error.
                    type: string
                stdout:
                    description: The command's standard output.
                    type: string
            type: object
        ExtendVolumeRequest:
            properties:
                size_gb:
                    description: |-
                        New size of the volume in GiB. Must be larger than the current size and at most the
                        organization's maximum (500 by default).
                    type: integer
            type: object
        ExtendVolumeResponse:
            properties:
                needs_restart:
                    description: |-
                        Whether the volume is attached to a running Machine that could not resize its filesystem
                        while running. If true, restart the Machine for the filesystem to use the new size.
                    type: boolean
                volume:
                    allOf:
                        - $ref: '#/components/schemas/Volume'
                    description: The extended volume.
                    type: object
            type: object
        IPAssignment:
            properties:
                created_at:
                    description: |-
                        When the address was assigned to the app, in RFC 3339 format. Null for the app's shared
                        IPv4 address.
                    type: string
                egress:
                    description: |-
                        Whether this is an egress address, used for the app's outbound traffic rather than for
                        receiving requests.
                    type: boolean
                ip:
                    description: The IP address.
                    type: string
                network:
                    $ref: '#/components/schemas/IPAssignmentNetwork'
                region:
                    description: |-
                        Region the address is scoped to, or `global` for addresses announced in all regions.
                        Empty for the app's shared IPv4 address.
                    type: string
                service_name:
                    description: Name of the service the address is scoped to, if any.
                    type: string
                shared:
                    description: Whether this is the app's shared IPv4 address, which other apps use too.
                    type: boolean
            type: object
        IPAssignmentNetwork:
            description: The 6PN network a Flycast (private_v6) address belongs to. Null for all other IP types.
            properties:
                name:
                    description: Network name; empty for the organization's default network.
                    type: string
                org_slug:
                    description: Slug of the organization the network belongs to.
                    type: string
            type: object
        IPAssignmentType:
            description: Type of IP address to allocate. "egress_pair" allocates both v4 and v6 egress IP addresses (recommended when using egress IPs).
            enum:
                - v4
                - v6
                - shared_v4
                - private_v6
                - egress_v4
                - egress_v6
                - egress_pair
            type: string
            x-enum-varnames:
                - IPAssignmentType_v4
                - IPAssignmentType_v6
                - IPAssignmentType_shared_v4
                - IPAssignmentType_private_v6
                - IPAssignmentType_egress_v4
                - IPAssignmentType_egress_v6
                - IPAssignmentType_egress_pair
        IPPair:
            properties:
                v4:
                    description: The egress IPv4 address.
                    type: string
                v6:
                    description: The egress IPv6 address.
                    type: string
            type: object
        ImageRef:
            properties:
                digest:
                    description: Content digest of the image (`sha256:...`).
                    type: string
                labels:
                    additionalProperties:
                        type: string
                    description: The image's OCI labels.
                    type: object
                registry:
                    description: Registry host of the image, such as `registry.fly.io`.
                    type: string
                repository:
                    description: Repository of the image within the registry, such as `library/nginx`.
                    type: string
                tag:
                    description: Tag the image was referenced by, if any.
                    type: string
            type: object
        IssuedCertificate:
            properties:
                certificate_authority:
                    description: The certificate authority that issued the certificate.
                    type: string
                expires_at:
                    description: When the certificate expires.
                    type: string
                type:
                    description: Key type of the certificate.
                    enum:
                        - rsa
                        - ecdsa
                    type: string
            type: object
        Lease:
            properties:
                description:
                    description: Description or reason for the lease.
                    type: string
                expires_at:
                    description: When the lease expires, in Unix seconds.
                    type: integer
                nonce:
                    description: |-
                        Unique ID generated for the lease. Pass it in the `fly-machine-lease-nonce` header to
                        act on the leased Machine, refresh the lease, or release it.
                    type: string
                owner:
                    description: Email address of the user who acquired the lease.
                    type: string
                version:
                    description: ID of the Machine's version at the time of the request.
                    type: string
            type: object
        LeaseErrorResponse:
            properties:
                message:
                    description: What went wrong.
                    type: string
                status:
                    description: Always `error`.
                    enum:
                        - error
                    type: string
            type: object
        LeaseOkResponse:
            properties:
                data:
                    $ref: '#/components/schemas/OkResponse'
                status:
                    description: Always `success`.
                    enum:
                        - success
                    type: string
            type: object
        LeaseResponse:
            properties:
                data:
                    allOf:
                        - $ref: '#/components/schemas/Lease'
                    description: The lease.
                    type: object
                status:
                    description: Always `success`.
                    enum:
                        - success
                    type: string
            type: object
        ListAppsResponse:
            properties:
                apps:
                    description: The apps on this page, or all apps if `limit` was not provided.
                    items:
                        $ref: '#/components/schemas/App'
                    type: array
                next_cursor:
                    description: |-
                        Pagination cursor for the next page. Absent when no more apps remain.
                        Cursors expire 30 minutes after the first page was requested.
                    type: string
                total_apps:
                    description: |-
                        The number of apps matching the request, across all pages. When
                        paginating, it is counted once when the first page is requested and not
                        updated afterwards, so it may differ slightly from the number of apps
                        returned: it excludes apps created later and includes apps deleted while
                        paginating. Apps created in the seconds before the first page may also be
                        counted but missing from the pages.
                    type: integer
            type: object
        ListenSocket:
            properties:
                address:
                    description: Local address and port the socket is bound to, such as `0.0.0.0:8080` or `[::]:8080`.
                    type: string
                proto:
                    description: Protocol of the socket. Always `tcp`.
                    type: string
            type: object
        Machine:
            properties:
                checks:
                    description: |-
                        Status of each health check: the Machine's top-level `checks` and its services'
                        checks.
                    items:
                        $ref: '#/components/schemas/CheckStatus'
                    type: array
                config:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineConfig'
                    description: |-
                        The Machine's configuration, as provided when it was created or last updated, with
                        `metadata` and `mounts` reflecting their current values. Null when the host is not
                        reachable (`host_status` is not `ok`) or `summary=true` was requested; see
                        `incomplete_config`.
                    type: object
                cordoned:
                    description: |-
                        Whether the Machine is cordoned, meaning Fly Proxy does not route requests to it. See
                        the Cordon Machine endpoint.
                    type: boolean
                created_at:
                    description: When the Machine was created.
                    type: string
                events:
                    description: |-
                        Up to 5 of the most recent events of the current Machine version, newest first. Use
                        the List Events endpoint for more.
                    items:
                        $ref: '#/components/schemas/MachineEvent'
                    type: array
                host_features:
                    description: |-
                        Features of the Machine's host, for comparison with `config.guest.required_host_features`.
                        Only returned when the request sets the `fly-include-host-features: true` header.
                    items:
                        type: string
                    type: array
                host_status:
                    description: |-
                        Whether Fly.io could reach the Machine's host: `ok` if it could, `unreachable` if it
                        could not, in which case the response is built from last known state. `unknown` if the
                        host's status was not reported.
                    enum:
                        - ok
                        - unknown
                        - unreachable
                    type: string
                id:
                    description: Unique ID of the Machine.
                    type: string
                image_ref:
                    allOf:
                        - $ref: '#/components/schemas/ImageRef'
                    description: The image the Machine runs, as resolved when it was last created or updated.
                    type: object
                incomplete_config:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineConfig'
                    description: |-
                        Last known configuration, returned in place of `config` when the host could not be
                        reached (`host_status` is not `ok`) or when listing Machines with `summary=true`. It
                        comes from Fly.io's replicated state rather than the host, so it may be stale or lack
                        fields.
                    type: object
                instance_id:
                    description: |-
                        Same value as `version`.

                        Deprecated: use `version`.
                    type: string
                lease:
                    allOf:
                        - $ref: '#/components/schemas/StrippedLease'
                    description: |-
                        The lease currently held on the Machine. Only returned when `include_leases=true`
                        was requested and a lease is held.
                    type: object
                name:
                    description: |-
                        Name of the Machine. Generated when not provided at creation. Names are not required
                        to be unique.
                    type: string
                nonce:
                    description: |-
                        Nonce of the lease acquired on the Machine at creation. Only returned when creating a
                        Machine with `lease_ttl` set. Pass it in the `fly-machine-lease-nonce` header to act on
                        the Machine while the lease is held.
                    type: string
                private_ip:
                    description: The Machine's address on the organization's private (6PN) IPv6 network.
                    type: string
                region:
                    description: Code of the region the Machine runs in, such as `iad`.
                    type: string
                state:
                    description: |-
                        Current state of the Machine, taken from the status of its most recent event. One of
                        `created`, `starting`, `started`, `stopping`, `stopped`, `suspending`, `suspended`,
                        `replacing`, `replaced`, `destroying`, `destroyed`, `failed`, `migrating`, `migrated`,
                        `archived`, or `pending`. See https://fly.io/docs/machines/machine-states/.
                    type: string
                updated_at:
                    description: |-
                        Time of the Machine's most recent event, truncated to whole seconds. The zero time
                        (0001-01-01T00:00:00Z) if the host could not be reached. With `summary=true`, the time
                        Fly.io last recorded a change to the Machine.
                    type: string
                version:
                    description: |-
                        Unique ID of this version of the Machine. Every update creates a new version. Pass it
                        as `current_version` when updating the Machine to reject the update if the Machine has
                        changed since this version.
                    type: string
            type: object
        MachineEvent:
            properties:
                id:
                    description: Unique ID of the event (a ULID).
                    type: string
                request:
                    description: |-
                        Details that depend on the event type. For example, `exit` events carry the exit
                        code and whether the process was killed for running out of memory, and `update`
                        events carry the new version.
                    type: object
                source:
                    description: |-
                        Who triggered the event: `user` for requests to this API, `flyd` for the host's
                        Machine manager acting on its own (for example when a Machine exits or restarts), or
                        `proxy` for Fly Proxy starting and stopping Machines.
                    type: string
                status:
                    description: |-
                        The state the Machine moved to with this event, such as `created`, `started`, or
                        `stopped`. The Machine's `state` is the status of its latest event.
                    type: string
                timestamp:
                    description: When the event happened, in Unix milliseconds.
                    type: integer
                type:
                    description: |-
                        What happened, such as `launch`, `start`, `stop`, `exit`, `restart`, `update`,
                        `suspension`, `cancel_suspension`, `migration`, `metadata_update`, `archive`, or
                        `destroy`.
                    type: string
            type: object
        MachineExecRequest:
            properties:
                cmd:
                    description: |-
                        Command line to run, split into arguments like a shell would. Takes precedence over
                        `command`.

                        Deprecated: use `command`.
                    type: string
                command:
                    description: |-
                        Command to run, as the program followed by its arguments. It is run directly, not by a
                        shell.
                    items:
                        type: string
                    type: array
                container:
                    description: Name of the container to run the command in, for Machines with containers.
                    type: string
                machine:
                    description: |-
                        Run the command in the Machine's own namespace instead of in a container. Mutually
                        exclusive with `container`.
                    type: boolean
                stdin:
                    description: Data to write to the command's standard input.
                    type: string
                timeout:
                    description: How long to let the command run, in seconds. Defaults to 10; at most 600.
                    type: integer
            type: object
        MachineOverviewConfig:
            properties:
                guest:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineGuest'
                    description: The Machine's CPU, memory, and GPU configuration.
                    type: object
                image:
                    description: The image reference the Machine was configured with.
                    type: string
                metadata:
                    additionalProperties:
                        type: string
                    description: The Machine's metadata key-value pairs.
                    type: object
            type: object
        MachineVersion:
            properties:
                user_config:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineConfig'
                    description: The configuration of that version, as provided by the create or update request.
                    type: object
                version:
                    description: ID of the Machine version.
                    type: string
            type: object
        OkResponse:
            properties:
                ok:
                    description: Always true.
                    type: boolean
            type: object
        OrgMachine:
            properties:
                app_name:
                    description: Name of the app the Machine belongs to.
                    type: string
                config:
                    allOf:
                        - $ref: '#/components/schemas/MachineOverviewConfig'
                    description: Subset of the Machine's configuration. Omitted when `summary=true`.
                    type: object
                created_at:
                    description: When the Machine was created.
                    type: string
                id:
                    description: Unique ID of the Machine.
                    type: string
                name:
                    description: Name of the Machine.
                    type: string
                private_ip:
                    description: The Machine's address on the organization's private (6PN) IPv6 network.
                    type: string
                region:
                    description: Code of the region the Machine runs in.
                    type: string
                state:
                    description: Current state of the Machine; see the `state` field of Machine.
                    type: string
                updated_at:
                    description: When Fly.io last recorded a change to the Machine.
                    type: string
                version:
                    description: ID of the Machine's current version.
                    type: string
            type: object
        OrgMachinesResponse:
            properties:
                error_regions:
                    description: Regions that could not be queried. Their Machines are missing from the response.
                    items:
                        type: string
                    type: array
                last_machine_id:
                    description: ID of the last Machine on this page.
                    type: string
                last_updated_at:
                    description: '`updated_at` of the last Machine on this page.'
                    type: string
                machines:
                    description: The Machines on this page.
                    items:
                        $ref: '#/components/schemas/OrgMachine'
                    type: array
                next_cursor:
                    description: |-
                        Pagination cursor for the next page. Absent when no more Machines remain. Cursors expire
                        30 minutes after the first page was requested.
                    type: string
            type: object
        OrgVolume:
            properties:
                app_name:
                    description: Name of the app the volume belongs to.
                    type: string
                attached_alloc_id:
                    description: |-
                        Always null.

                        Deprecated: volumes are no longer attached to Nomad allocations.
                    type: string
                attached_machine_id:
                    description: ID of the Machine the volume is attached to, or null if it is not attached.
                    type: string
                auto_backup_enabled:
                    description: Whether daily automatic snapshots are taken.
                    type: boolean
                block_size:
                    description: Size of a filesystem block, in bytes. See `blocks`.
                    type: integer
                blocks:
                    description: |-
                        Size of the volume's filesystem, in blocks of `block_size` bytes, as last reported by a
                        Machine that mounted the volume. 0 if never reported, if the host could not be reached,
                        or with `summary=true`.
                    type: integer
                blocks_avail:
                    description: Number of filesystem blocks available to unprivileged users. See `blocks`.
                    type: integer
                blocks_free:
                    description: |-
                        Number of free filesystem blocks, including blocks reserved for the root user. See
                        `blocks`.
                    type: integer
                bytes_total:
                    description: Size of the volume, in bytes. 0 if the host could not be reached or with `summary=true`.
                    type: integer
                bytes_used:
                    description: |-
                        Bytes of storage the volume occupies on its host. Volumes are thinly provisioned, so this
                        grows as blocks are written and does not shrink when files are deleted. It is not the
                        filesystem's usage; use `blocks` and `blocks_free` for that. 0 if the host could not be
                        reached or with `summary=true`.
                    type: integer
                created_at:
                    description: When the volume was created.
                    type: string
                encrypted:
                    description: Whether the volume is encrypted at rest.
                    type: boolean
                fstype:
                    description: |-
                        Filesystem the volume was formatted with: `ext4`, or `raw` for an unformatted block
                        device.
                    type: string
                host_features:
                    description: |-
                        Features of the volume's host. Only returned when the request sets the
                        `fly-include-host-features: true` header.
                    items:
                        type: string
                    type: array
                host_status:
                    description: |-
                        Whether Fly.io could reach the volume's host: `ok` if it could, `unreachable` or
                        `unknown` if it could not, in which case host-reported fields are missing.
                    enum:
                        - ok
                        - unknown
                        - unreachable
                    type: string
                id:
                    description: Unique ID of the volume, such as `vol_1234567890abcdef`.
                    type: string
                name:
                    description: Name of the volume. Several volumes of an app can share a name.
                    type: string
                region:
                    description: Code of the region the volume is in.
                    type: string
                required_host_features:
                    description: |-
                        Host features the volume's host was required to have; see `compute.required_host_features`
                        in the create request.
                    items:
                        type: string
                    type: array
                size_gb:
                    description: Size of the volume, in GiB.
                    type: integer
                snapshot_retention:
                    description: Number of days snapshots of the volume are kept.
                    type: integer
                state:
                    description: |-
                        State of the volume, such as `creating`, `created`, `extending`, `restoring`,
                        `hydrating`, `scheduling_destroy`, `pending_destroy`, `destroying`, `destroyed`, or
                        `failed`.
                    type: string
                type:
                    description: |-
                        Kind of volume: `local` for regular volumes, or `cache` for volumes that hold
                        disposable data and support neither snapshots nor restores.
                    enum:
                        - local
                        - cache
                    type: string
                updated_at:
                    description: When Fly.io last recorded a change to the volume.
                    type: string
                zone:
                    description: |-
                        Identifies the host the volume is on. Volumes with different zones are on different
                        hosts.
                    type: string
            type: object
        OrgVolumesResponse:
            properties:
                last_updated_at:
                    description: '`updated_at` of the last volume on this page.'
                    type: string
                last_volume_id:
                    description: ID of the last volume on this page.
                    type: string
                next_cursor:
                    description: Pagination cursor for the next page. Absent when no more volumes remain.
                    type: string
                volumes:
                    description: The volumes on this page.
                    items:
                        $ref: '#/components/schemas/OrgVolume'
                    type: array
            type: object
        OrganizationRef:
            properties:
                name:
                    description: Organization name.
                    type: string
                slug:
                    description: Organization slug.
                    type: string
            type: object
        OwnershipVerification:
            properties:
                app_value:
                    description: TXT record value that proves ownership for this app.
                    type: string
                name:
                    description: Name of the TXT record to create, such as `_fly-ownership.example.com`.
                    type: string
                org_value:
                    description: TXT record value that proves ownership for every app in the organization.
                    type: string
            type: object
        PostgresActiveQuery:
            properties:
                application_name:
                    description: Application connected to the backend.
                    type: string
                client:
                    description: Client address.
                    type: string
                database:
                    description: Database name.
                    type: string
                duration_seconds:
                    description: Query duration in seconds.
                    type: number
                pid:
                    description: Process ID of the backend running the query.
                    type: integer
                query:
                    description: Full query text.
                    type: string
                state:
                    description: Current backend state.
                    type: string
                state_duration_seconds:
                    description: Time spent in the current state, in seconds.
                    type: number
                user:
                    description: User running the query.
                    type: string
                wait_event:
                    description: Event the backend is waiting for.
                    type: string
                wait_event_type:
                    description: Type of event the backend is waiting for.
                    type: string
            type: object
        PostgresAttachedApp:
            properties:
                name:
                    description: Attached Fly app name.
                    type: string
            type: object
        PostgresAttachment:
            properties:
                app_name:
                    description: Attached Fly app name.
                    type: string
                attached_at:
                    description: RFC 3339 timestamp when the attachment was created.
                    type: string
                postgres_cluster_id:
                    description: Cluster ID the app is attached to.
                    type: string
            type: object
        PostgresBackup:
            properties:
                finished_at:
                    description: RFC 3339 stop timestamp.
                    type: string
                id:
                    description: Backup ID.
                    type: string
                size_bytes:
                    description: Backup size in bytes.
                    type: integer
                started_at:
                    description: RFC 3339 start timestamp.
                    type: string
                status:
                    description: Backup status.
                    example: completed
                    type: string
                type:
                    description: Backup type.
                    enum:
                        - full
                        - incr
                        - diff
                    type: string
            type: object
        PostgresCluster:
            properties:
                attached_apps:
                    description: Apps attached to the cluster.
                    items:
                        $ref: '#/components/schemas/PostgresAttachedApp'
                    type: array
                cpu_kind:
                    description: CPU class.
                    enum:
                        - shared
                        - performance
                    example: shared
                    type: string
                cpus:
                    description: vCPUs per node.
                    example: 2
                    type: integer
                created_at:
                    description: RFC 3339 creation timestamp.
                    format: date-time
                    type: string
                disk_size_gb:
                    description: Disk size in gigabytes, for one replica.
                    example: 10
                    type: integer
                endpoints:
                    allOf:
                        - $ref: '#/components/schemas/PostgresClusterEndpoints'
                    description: Connection endpoints. Populated once the cluster is ready.
                    type: object
                id:
                    description: Cluster ID.
                    type: string
                memory_mb:
                    description: Memory per node in megabytes.
                    example: 1024
                    type: integer
                name:
                    description: Cluster name.
                    type: string
                organization:
                    $ref: '#/components/schemas/OrganizationRef'
                pg_major_version:
                    description: Postgres major version.
                    enum:
                        - "16"
                        - "17"
                    example: "17"
                    type: string
                plan:
                    description: Plan slug.
                    enum:
                        - basic
                        - starter
                        - launch
                        - scale
                        - Performance
                    example: basic
                    type: string
                postgis_enabled:
                    description: Whether PostGIS support is enabled.
                    type: boolean
                region:
                    description: Fly region code.
                    example: iad
                    type: string
                replicas:
                    description: Number of replicas.
                    example: 1
                    type: integer
                status:
                    description: Current lifecycle status.
                    enum:
                        - creating
                        - initializing
                        - ready
                        - deleting
                        - deleted
                        - failed
                    example: ready
                    type: string
                storage_provisioned_bytes:
                    description: |-
                        Storage provisioned, summed across the cluster's volumes and measured hourly.
                        Null until first measured.
                    example: 1.073741824e+10
                    type:
                        - integer
                        - "null"
                storage_used_bytes:
                    description: |-
                        Storage used, summed across the cluster's volumes and measured hourly. Null
                        until first measured.
                    example: 5.36870912e+09
                    type:
                        - integer
                        - "null"
            type: object
        PostgresClusterEndpoints:
            properties:
                primary:
                    allOf:
                        - $ref: '#/components/schemas/PostgresNodeEndpoints'
                    description: Endpoints for connecting to the primary node.
                    type: object
            type: object
        PostgresClusterSummary:
            properties:
                attached_apps:
                    description: Apps attached to the cluster.
                    items:
                        $ref: '#/components/schemas/PostgresAttachedApp'
                    type: array
                created_at:
                    description: RFC 3339 creation timestamp.
                    format: date-time
                    type: string
                deleted_at:
                    description: RFC 3339 deletion timestamp; present for deleted clusters.
                    type: string
                id:
                    description: Cluster ID.
                    type: string
                name:
                    description: Cluster name.
                    type: string
                plan:
                    description: Plan slug.
                    enum:
                        - basic
                        - starter
                        - launch
                        - scale
                        - Performance
                    example: basic
                    type: string
                region:
                    description: Fly region code.
                    example: iad
                    type: string
                status:
                    description: Current lifecycle status.
                    enum:
                        - creating
                        - initializing
                        - ready
                        - deleting
                        - deleted
                        - failed
                    example: ready
                    type: string
            type: object
        PostgresDatabase:
            properties:
                name:
                    description: Database name.
                    type: string
            type: object
        PostgresEndpoint:
            properties:
