info:
    contact: {}
    description: This site hosts documentation generated from the Fly.io Machines API OpenAPI specification. Visit our complete [Machines API docs](https://fly.io/docs/machines/api/) for how to get started, more information about each endpoint, parameter descriptions, and examples.
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Machines API
    version: "1.0"
paths:
    /v1/apps:
        get:
            description: |
                List all apps with the ability to filter by organization slug.
            operationId: Apps_list
            parameters:
                - description: The org slug, or 'personal', to filter apps
                  in: query
                  name: org_slug
                  required: true
                  schema:
                    type: string
                - description: Filter apps by role
                  in: query
                  name: app_role
                  schema:
                    type: string
                - description: The number of apps to fetch (must be between 1 and 5000). Providing a limit enables pagination. Without it, all apps are returned in one response.
                  in: query
                  name: limit
                  schema:
                    type: integer
                - description: Value of next_cursor from the previous page. Requires limit. Later pages only include apps that existed when the first page was requested. Apps created in the seconds before the first page was requested may be missing. Cursors expire 30 minutes after the first page was requested.
                  in: query
                  name: cursor
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListAppsResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
            summary: List Apps
            tags:
                - Apps
        post:
            description: |
                Create an app with the specified details in the request body.
            operationId: Apps_create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateAppRequest'
                description: App body
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAppResponse'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Bad Request
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Rejected by validation. status is name_taken when the app name is already in use.
            summary: Create App
            tags:
                - Apps
            x-codegen-request-body-name: request
    /v1/apps/{app_name}/certificates:
        get:
            operationId: App_Certificates_list
            parameters:
                - description: Fly App Name
                  in: path
                  name: app_name
                  required: true
                  schema:
                    type: string
                - description: Hostname filter (substring match)
                  in: query
                  name: filter
                  schema:
                    type: string
                - description: Pagination cursor from previous response
                  in: query
                  name: cursor
                  schema:
                    type: string
                - description: Number of results per page (default 25, max 500)
                  in: query
                  name: limit
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/listCertificatesResponse'
                    description: OK
            summary: List certificates for app
            tags:
                - TLS Certificates
    /v1/apps/{app_name}/certificates/{hostname}:
        delete:
            operationId: App_Certificates_delete
            parameters:
                - description: Fly App Name
                  in: path
                  name: app_name
                  required: true
                  schema:
                    type: string
                - description: Certificate Hostname
                  in: path
                  name: hostname
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: No Content
            summary: Remove certificate
            tags:
                - TLS Certificates
        get:
            operationId: App_Certificates_show
            parameters:
                - description: Fly App Name
                  in: path
                  name: app_name
                  required: true
                  schema:
                    type: string
                - description: Certificate Hostname
                  in: path
                  name: hostname
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CertificateDetail'
                    description: OK
            summary: Get certificate details
            tags:
                - TLS Certificates
    /v1/apps/{app_name}/certificates/{hostname}/acme:
        delete:
            operationId: App_Certificates_acme_delete
            parameters:
                - description: Fly App Name
                  in: path
                  name: app_name
                  required: true
                  schema:
                    type: string
                - description: Certificate Hostname
                  in: path
                  name: hostname
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CertificateDetail'
                    description: OK
            summary: Remove ACME certificates
            tags:
                - TLS Certificates
    /v1/apps/{app_name}/certificates/{hostname}/check:
        post:
            operationId: App_Certificates_check
            parameters:
                - description: Fly App Name
                  in: path
                  name: app_name
                  required: true
                  schema:
                    type: string
                - description: Certificate Hostname
                  in: path
                  name: hostname
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CertificateCheckResponse'
                    description: OK
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Not Found
            summary: Check DNS and re-validate certificate
            tags:
                - TLS Certificates
    /v1/apps/{app_name}/certificates/{hostname}/custom:
        delete:
            operationId: App_Certificates_custom_delete
            parameters:
                - description: Fly App Name
                  in: path
                  name: app_name
                  required: true
                  schema:
                    type: string
                - description: Certificate Hostname
                  in: path
                  name: hostname
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/destroyCustomCertificateResponse'
                    description: OK
            summary: Remove custom certificate
            tags:
                - TLS Certificates
    /v1/apps/{app_name}/certificates/acme:
        post:
            operationId: App_Certificates_acme_create
            parameters:
                - description: Fly App Name
                  in: path
                  name: app_name
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/createAcmeCertificateRequest'
                description: ACME certificate request
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CertificateDetail'
                    description: Created
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unprocessable Entity
            summary: Request ACME certificate
            tags:
                - TLS Certificates
            x-codegen-request-body-name: request
    /v1/apps/{app_name}/certificates/custom:
        post:
            operationId: App_Certificates_custom_create
            parameters:
                - description: Fly App Name
                  in: path
                  name: app_name
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/createCustomCertificateRequest'
                description: Custom certificate request
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CertificateDetail'
                    description: Created
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Unprocessable Entity
            summary: Upload custom certificate
