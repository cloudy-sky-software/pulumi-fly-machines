                        - SIGHUP
                        - SIGINT
                        - SIGQUIT
                        - SIGKILL
                        - SIGUSR1
                        - SIGUSR2
                        - SIGTERM
                    example: SIGTERM
                    type: string
                timeout:
                    description: |-
                        How long to wait for the Machine to exit after sending `signal` before killing it, as a
