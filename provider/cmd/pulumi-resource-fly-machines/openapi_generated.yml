                type:
                    description: Postgres type name.
                    example: int8
                    type: string
            type: object
        PostgresSlowQuery:
            properties:
                calls:
                    description: Cumulative number of executions.
                    type: integer
                database:
                    description: Database name.
                    type: string
                max_exec_time_seconds:
                    description: Maximum execution time in seconds.
                    type: number
                mean_exec_time_seconds:
