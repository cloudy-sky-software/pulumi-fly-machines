                    items:
                        $ref: '#/components/schemas/main.regionRow'
                    type: array
                nearest:
                    description: |-
                        Code of the region of the Fly.io edge that received the request, usually the one
                        closest to the caller.
                    type: string
            type: object
        main.regionRow:
            properties:
                code:
                    description: Region code, such as `iad`, used to select the region in other requests.
                    type: string
                deprecated:
                    description: Whether the region is deprecated. Avoid creating new resources in it.
