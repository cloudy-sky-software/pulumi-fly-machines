                        `config`. If omitted, the app's current secrets version is looked up for you.
                    type: integer
                name:
                    description: Ignored.
                    type: string
                region:
                    description: 'Not used to place the Machine: an update never moves it to another region or host.'
                    type: string
                skip_launch:
                    description: |-
                        Apply the update without starting the Machine. It ends up `stopped`; start it with the
                        Start Machine endpoint. Not allowed for spot Machines.
                    type: boolean
                skip_secrets:
                    description: |-
                        Don't look up the app's current secrets version. The Machine still gets the app's
                        secrets, but may not see recent changes to them. Takes precedence over
                        `min_secrets_version`.
                    type: boolean
                skip_service_registration:
                    description: Ignored. Use the cordon and uncordon endpoints instead.
                    type: boolean
            type: object
        UpdateVolumeRequest:
            properties:
                auto_backup_enabled:
                    description: Take daily automatic snapshots of the volume. Unchanged if omitted.
