                    description: ALPN protocols to offer, e.g. `h2`, `http/1.1`. Defaults to `h2` and `http/1.1`
                    items:
                        type: string
                    type: array
                default_self_signed:
                    description: Use a self-signed certificate when there is no certificate for the requested hostname
                    type: boolean
                versions:
