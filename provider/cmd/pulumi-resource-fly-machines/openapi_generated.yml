                    items:
                        $ref: '#/components/schemas/PostgresQueryColumn'
                    type: array
                row_count:
                    description: Number of rows returned.
                    type: integer
                rows:
                    description: Rows of the final result set; each row holds one JSON value per column, with NULL as null and json/jsonb as decoded JSON.
                    items:
                        items:
                            type: object
                        type: array
                    type: array
            type: object
        queryPostgresDatabaseRequest:
            properties:
                sql:
                    description: SQL to run, up to 102400 bytes. Multiple statements are allowed; only the last result set is returned.
                    example: SELECT id, email FROM users LIMIT 10
                    type: string
            required:
                - sql
            type: object
        resset.Action:
            enum:
                - 1
                - 2
                - 4
                - 8
                - 16
                - 31
                - 0
            format: int32
            type: integer
            x-enum-varnames:
                - ActionRead
                - ActionWrite
                - ActionCreate
                - ActionDelete
                - ActionControl
                - ActionAll
                - ActionNone
        restorePostgresClusterRequest:
            properties:
                backup_id:
                    description: Backup label to restore from, as returned by the backups list. Mutually exclusive with pitr_time.
                    type: string
                name:
                    description: Name for the restored cluster. Defaults to a generated name derived from the source cluster and backup/point in time when omitted or blank.
                    type: string
                pitr_time:
                    description: Point in time to restore to, as an RFC3339 timestamp with an explicit offset from UTC (e.g. Z or +02:00). Normalized to UTC and must fall within the cluster's PITR recovery window. Mutually exclusive with backup_id.
                    type: string
            type: object
        root.VerifiedToken:
            properties:
                caveats:
                    $ref: '#/components/schemas/macaroon.CaveatSet'
                header:
                    type: string
                nonce:
                    $ref: '#/components/schemas/macaroon.Nonce'
                permission_token:
                    items:
                        type: integer
                    type: array
            type: object
        rotatePostgresPasswordRequest:
            properties:
                kill_sessions:
                    description: Terminate the user's existing sessions after rotating.
                    type: boolean
            type: object
        rotatePostgresPasswordResponse:
            properties:
                data:
                    $ref: '#/components/schemas/PostgresUserCredentials'
            type: object
        showPostgresClusterResponse:
            properties:
                data:
                    $ref: '#/components/schemas/PostgresCluster'
            type: object
        updateMetadataRequest:
            properties:
                machine_version:
                    description: |-
                        Only apply the change if this is still the Machine's current version; otherwise fail
                        with 412. Defaults to the current version.
                    type: string
                metadata:
                    additionalProperties:
                        type: string
                    description: |-
                        Keys to change. A string value sets the key; null, an empty string or whitespace removes
                        it. Keys and values have surrounding whitespace trimmed. Keys not listed are left alone.
                        Must contain at least one key.
                    type: object
                updated_at:
                    description: Time to record for the change in the Machine's `metadata_update` event. Defaults to now.
                    type: string
            type: object
        updatePostgresUserRoleRequest:
            properties:
                role:
                    description: New role for the user.
                    enum:
                        - schema_admin
                        - writer
                        - reader
                    example: reader
                    type: string
            required:
                - role
            type: object
        upsertMetadataKeyRequest:
            properties:
                updated_at:
                    description: Time to record for the change in the Machine's `metadata_update` event. Defaults to now.
                    type: string
                value:
                    description: Value to set. Must not be empty or whitespace only.
                    type: string
            type: object
