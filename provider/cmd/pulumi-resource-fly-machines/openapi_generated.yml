                    type: string
                expires_at:
                    description: When the lease expires, in Unix seconds.
                    type: integer
                owner:
                    description: Email address of the user who acquired the lease.
                    type: string
            type: object
        UpdateMachineRequest:
            properties:
                config:
                    allOf:
                        - $ref: '#/components/schemas/fly.MachineConfig'
                    description: The new Machine configuration. It replaces the current one entirely.
                    type: object
                current_version:
                    description: |-
                        Optional optimistic-concurrency guard: the Machine's `version`, as returned by create,
                        get or a previous update. When set and it is no longer the Machine's current version,
                        the update is rejected with 409 Conflict and nothing changes. Omit it to update
                        unconditionally.
                    type: string
                lease_ttl:
                    description: Ignored. Use the lease endpoints to lease an existing Machine.
                    type: integer
                min_secrets_version:
                    description: |-
                        The minimum version of the app's secrets the Machine must run with. Set it to the `version`
