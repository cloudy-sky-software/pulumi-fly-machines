                    description: Bad Request
                "412":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: An error occurred before or during command execution
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: Size limit exceeded; status is exec_request_too_large or exec_output_too_large
            summary: Execute Command
