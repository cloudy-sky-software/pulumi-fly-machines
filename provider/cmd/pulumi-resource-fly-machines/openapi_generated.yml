                    type: string
                value:
                    description: Key material, base64-encoded. Ignored when generating a key.
                    format: byte
                    pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                    type: string
            type: object
        SetSecretkeyResponse:
            properties:
                created_at:
                    description: When the key was first set.
                    type: string
                name:
                    description: Name of the secret key.
                    type: string
                public_key:
                    description: Public key of asymmetric keys (`nacl_box`, `nacl_sign`, `es256`), base64-encoded.
                    format: byte
                    pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                    type: string
                type:
                    description: 'Type of the key: `hs256`, `hs384`, `hs512`, `xaes256gcm`, `nacl_auth`, `nacl_box`, `nacl_secretbox`, `nacl_sign`, or `es256`.'
                    type: string
                updated_at:
                    description: When the key last changed.
                    type: string
                version:
                    description: |-
                        The app's secrets version after this change. Pass it as `min_version` to read the change
