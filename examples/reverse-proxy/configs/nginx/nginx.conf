# nginx.conf  --  docker-openresty
#
# This file is installed to:
#   `/usr/local/openresty/nginx/conf/nginx.conf`
# and is the file loaded by nginx at startup,
# unless the user specifies otherwise.
#
# It tracks the upstream OpenResty's `nginx.conf`, but removes the `server`
# section and adds this directive:
#     `include /etc/nginx/conf.d/*.conf;`
#
# The `docker-openresty` file `nginx.vh.default.conf` is copied to
# `/etc/nginx/conf.d/default.conf`.  It contains the `server section
# of the upstream `nginx.conf`.
#
# See https://github.com/openresty/docker-openresty/blob/master/README.md#nginx-config-files
#

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    # Send logs to the syslog server hosted
    # by the private CrowdSec engine.
    error_log  syslog:server=deskypus-cs.flycast:8080 error;
    access_log syslog:server=deskypus-cs.flycast:8080,facility=local7,tag=nginx,severity=info;

    client_body_temp_path /tmp/openresty/nginx-client-body;
    proxy_temp_path       /tmp/openresty/nginx-proxy;
    fastcgi_temp_path     /tmp/openresty/nginx-fastcgi;
    uwsgi_temp_path       /tmp/openresty/nginx-uwsgi;
    scgi_temp_path        /tmp/openresty/nginx-scgi;

    sendfile        off;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip  on;

    include /etc/nginx/conf.d/*.conf;

    # Don't reveal OpenResty version to clients.
    server_tokens off;

    # Static asset cache (browser caching)
    map $sent_http_content_type $cache_control {
        default                    "public, max-age=604800, immutable";
        text/html                  "no-cache";
        application/json           "no-cache";
        application/octet-stream   "no-cache";
    }

    # Define cache zone
    # levels: directory structure (2:2 = two levels, two characters each)
    # keys_zone: name and size for storing cache keys in memory
    # max_size: maximum disk space for cached content
    # inactive: remove items not accessed for this duration
    #
    # The path `/tmp/openresty` is mounted as a temp
    # disk in the VM.
    proxy_cache_path /tmp/openresty/cache
                     levels=1:2
                     keys_zone=static_cache:2m
                     max_size=50m
                     inactive=7d
                     use_temp_path=off;
}

include /etc/nginx/conf.d/*.main;
